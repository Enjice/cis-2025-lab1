name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test:allure -- --run
        env:
          ALLURE_RESULTS_DIR: allure-results

      - name: Restore .NET dependencies
        working-directory: ./backend
        run: dotnet restore

      - name: Run backend tests with Allure
        working-directory: ./backend
        run: |
          mkdir -p allure-results
          export ALLURE_RESULTS_DIR=${{ github.workspace }}/backend/allure-results
          dotnet test Tests/Tests.csproj

      - name: Download Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          tar -zxvf allure-2.24.1.tgz
          sudo mv allure-2.24.1 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      - name: Collect all Allure results
        run: |
          mkdir -p combined-allure-results
          # Копируем результаты из frontend
          if [ -d "frontend/allure-results" ]; then
            cp -r frontend/allure-results/* combined-allure-results/ || true
          fi
          # Копируем результаты из backend
          find backend -type d -name "allure-results" -not -path "*/node_modules/*" | while read dir; do
            if [ -d "$dir" ] && [ "$(ls -A $dir 2>/dev/null)" ]; then
              cp -r "$dir"/* combined-allure-results/ || true
            fi
          done

      - name: Get Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        run: |
          # Копируем историю из gh-pages если есть
          if [ -d "gh-pages/history" ]; then
            mkdir -p combined-allure-results/history
            cp -r gh-pages/history/* combined-allure-results/history/ || true
          fi
          # Генерируем отчет
          allure generate combined-allure-results -o allure-report --clean

      - name: Upload Allure Report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report